server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular: si el archivo no existe, devuelve index.html
    # Esto permite que el router de Angular maneje /login, /admin, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash en el nombre (generados por ng build)
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear el index.html para que siempre sirva la versión nueva
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
