spring:
  application:
    name: votaciones-api

  # ── Base de datos ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:votaciones}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: VotacionesPool
      maximum-pool-size: 20        # Máximo de conexiones simultáneas
      minimum-idle: 5              # Conexiones mínimas en espera
      connection-timeout: 30000    # 30 s para obtener conexión del pool
      idle-timeout: 600000         # 10 min antes de cerrar conexión ociosa
      max-lifetime: 1800000        # 30 min vida máxima de una conexión
      # Verifica que la conexión esté viva antes de usarla
      connection-test-query: SELECT 1

  # ── Migraciones Flyway ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # Útil si la BD ya existe
    validate-on-migrate: true      # Falla si un script ya aplicado fue modificado

# ── JWT ───────────────────────────────────────────────────────
jwt:
  # IMPORTANTE: cambiar por un valor seguro en producción (mínimo 256 bits en base64)
  # Generar con: openssl rand -base64 64
  secret: ${JWT_SECRET:c2VjcmV0b3NlZ3Vyb3BhcmF2b3RhY2lvbmVzZW50aWVtcG9yZWFsMTIzNDU2Nzg=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 horas en ms

# ── Servidor ──────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  error:
    # No exponer stack traces en respuestas de error
    include-stacktrace: never
    include-message: always

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.votaciones: DEBUG
    org.springframework.security: DEBUG    # Útil en desarrollo, cambiar a INFO en prod
    org.springframework.web.socket: DEBUG

---
# ── Perfil de producción ──────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 50
logging:
  level:
    root: WARN
    com.votaciones: INFO
    org.springframework.security: WARN
    org.springframework.web.socket: WARN
